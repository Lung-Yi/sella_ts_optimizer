[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ase-structure-optimizer"
version = "0.1.0"
description = "ASE-based geometry and transition-state optimization from a single XYZ structure."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ase",
    "sella",
    "numpy"
]

[project.optional-dependencies]
vibrations = ["geometric"]
mace = ["mace-torch", "mace-models"]
adsorption = ["pymatgen", "networkx", "pyyaml", "pandas", "matplotlib", "pillow", "scipy", "mace-torch", "torch-dftd"]
test = ["pytest"]
all = ["geometric", "mace-torch", "mace-models", "pymatgen", "networkx", "pyyaml", "pandas", "matplotlib", "pillow", "scipy", "torch-dftd"]

[project.scripts]
ase-structure-opt = "ase_structure_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # ASE optimizers call the deprecated Optimizer.flush() internally.
    "ignore:Log flushes by default now:FutureWarning",
]
