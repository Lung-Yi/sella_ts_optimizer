[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sella-ts-optimizer"
version = "0.1.0"
description = "ASE-based geometry and transition-state optimization from a single XYZ structure."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ase",
    "sella",
    "numpy"
]

[project.optional-dependencies]
vibrations = ["geometric"]
mace = ["mace-torch", "mace-models"]
all = ["geometric", "mace-torch", "mace-models"]

[project.scripts]
sella-ts-opt = "sella_ts_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
